<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.7, minimum-scale=0.7">
    <meta name="description" content="A PLACE SHATTERED ACROSS TIME AND SPACE.">
    <title>404_NOT_FOUND</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div id="sidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="sbHide()">&lt;&lt; ◇☰</a>
    </div>


    <div class="topbar" id="topbar">
        <span style="cursor: pointer;" onclick="sbShow()">◇☰</span>
        <span id="pageTitle" inert><img src="img/starrystopicon.png" height="30"/> &times; <img id="logoEN" src="img/subliminallogo.png" height="24"><img id="logoCN" src="img/subliminalCHlogo.png" height="24" style="display: none;"></span>
    </div>

    <div class="main centered" id="menu">
        <img src="img/forgotten_tree.gif" id="forgotten"/>
        <p>There is nothing.</p>
        <p>Except for the tree and the man.</p>
    </div>
    <img id="FRIEND" src="img/IMAGE_FRIEND.png" style="position: absolute; bottom: 112px; right: 44px; opacity: 5%;" onclick="hint()"/>
    <div class="main centered" id="menuCN" style="display: none;">
        <img src="img/forgotten_tree.gif" id="forgotten2"/>
        <p>这里什么也没有。</p>
        <p>那棵树，和树下的人，除外。</p>
    </div>
    <audio id="friend_laugh" type="audio/ogg" src="snd/ITS_LAUGH.ogg" preload style="display: none;"></audio>
    <script>
        function noTree(){
            document.getElementById('menu').innerHTML='<p>There is nothing.</p>';
            document.getElementById('menuCN').innerHTML='<p>这里什么也没有。</p>';
        }
        function getEgg(){
            localStorage.setItem('egg',1);
            noTree();
            const c=document.getElementById('menu');
            const cc=document.getElementById('menuCN');
            var yourname=localStorage.getItem('name');
            if(yourname=='' || yourname==null){
                c.innerHTML=c.innerHTML+'<p>You got the Egg.</p>'
                cc.innerHTML=cc.innerHTML+'<p>你得到了蛋。</p>'
            }else{
                c.innerHTML=c.innerHTML+'<p>'+yourname+' got the Egg.</p>'
                cc.innerHTML=cc.innerHTML+'<p>'+yourname+'得到了蛋。</p>'
            }
            
        }
        function hint(){
            let e=document.createElement('p');
            e.style.textAlign='right';
            e.style.position='absolute';
            e.style.bottom="10px";
            e.style.right='44px';
            e.style.opacity=0.05;
            e.innerHTML='Have you thought of giving a visit of the unlisted save page?<br/>Try clicking a lot...';
            const aud=document.getElementById('friend_laugh');
            aud.play();
            document.body.insertBefore(e,document.getElementById('FRIEND'));
            document.getElementById('FRIEND').style.display='none';
        }
        if(Number(localStorage.getItem('egg'))>0){
            noTree();
        }else{
            document.getElementById('forgotten').addEventListener('click',getEgg);
            document.getElementById('forgotten2').addEventListener('click',getEgg);
        }
    </script>
</body>
</html>
