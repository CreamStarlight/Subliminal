        <div class="textbox-short" id="cst">Castle Town</div>
        <div class="pagehidden" id="cstc">Where the Darkners live and where the Grand Fountain sits. More TBA.</div>
    </div>
    
    <script>
        function expansion(id){
            console.log("event initiated, id= "+id);
            const target=document.getElementById(id+"c");
            if(target.style.display=="block"){
                target.style.display="none";
            }else{
                target.style.display="block";
            }
            return;
        }

        document.getElementById('hmt').addEventListener("click",() => expansion("hmt"));
        document.getElementById('cst').addEventListener("click",() => expansion("cst"));
    </script>
