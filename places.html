<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.7, minimum-scale=0.7">
    <meta name="description" content="SUBLIMINAL.">
    <title>SURVEY_SUBLIMINAL</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div id="sidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="sbHide()">&lt;&lt; ◇☰</a>
    </div>


    <div class="topbar" id="topbar">
        <span style="cursor: pointer;" onclick="sbShow()">◇☰</span>
        <span id="pageTitle" inert><img src="img/starrystopicon.png" height="30"/> &times; <img src="img/subliminallogo.png" height="24"></span>
    </div>

    <div class="content" id="content">
        <h1 class="centered">IMPORTANT PLACES</h1>
        <div class="textbox-short" id="hmt">Hometown</div>
        <div class="pagehidden" id="hmtc">Where the Lightners live. More TBA.</div>
        <div class="textbox-short" id="cst">Castle Town</div>
        <div class="pagehidden" id="cstc">Where the Darkners live and where the Grand Fountain sits. More TBA.</div>
    </div>

    <div class="content" id="contentCN" style="display: none;">
        <h1 class="centered">重要地点</h1>
        <div class="textbox-short" id="hmt_z">Hometown</div>
        <div class="pagehidden" id="hmt_zc">光之民们（包含人类、怪物等）的住处。待补充。</div>
        <div class="textbox-short" id="cst_z">城堡小镇</div>
        <div class="pagehidden" id="cst_zc">暗之民们的住处。待补充。</div>
    </div>
    
    <script>
        var inter=[
            'hmt',
            'cst',
            'hmt_z',
            'cst_z'
        ]

        function expansion(id){
            console.log("event initiated, id= "+id);
            const target=document.getElementById(id+"c");
            if(target.style.display=="block"){
                target.style.display="none";
            }else{
                target.style.display="block";
            }
            return;
        }

        inter.forEach(slot=>{
            document.getElementById(slot).addEventListener("click",()=>expansion(slot));
        })
    </script>

</body>
</html>
