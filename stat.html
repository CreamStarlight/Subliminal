<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.7, minimum-scale=0.7">
    <meta name="description" content="LOCALLY STORED DATA.">
    <title>DEVICE_DATA</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="script.js" defer></script>
    <style>
        p{
            margin: 8px 0px;
        }
        .main p{
            text-shadow: 0px 1.5px black, 1.5px 1.5px black, 1.5px 0px black, 1.5px -1.5px black, 0px -1.5px black, -1.5px -1.5px black, -1.5px 0px black, -1.5px 1.5px black;
        }
        .grayout{
            color: gray;
        }
        input{
            border:none;
            border-bottom: 2px white solid;
            background: none;
            color:white;
            font-family: 'DeterminationSans';
            font-size:24px;
        }
        input:focus{
            outline:0;
        }
    </style>
</head>
<body>

    <div id="sidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="sbHide()">&lt;&lt; ◇☰</a>
    </div>


    <div class="topbar" id="topbar">
        <span style="cursor: pointer;" onclick="sbShow()">◇☰</span>
        <span id="pageTitle" inert><img src="img/starrystopicon.png" height="30"/> &times; <img id="logoEN" src="img/subliminallogo.png" height="24"><img id="logoCN" src="img/subliminalCHlogo.png" height="24" style="display: none;"></span>
    </div>

    <div class="content" id="content" style="user-select: none;">
        <h1 class="centered" id="title">STATISTICS</h1>
        <div class="centered text-left" style="display: flex; flex-direction: column;">
            <div style="display: flex; flex-direction: row; margin: 8px 0px;">
                <div style="width: 200px;" id="stat_name">You're known as</div>
                <div style="width: 300px; text-align: right;" id="value_name"></div>
                <input style="text-align: right;width:300px;display:none;" type="text" id="input_name" placeholder="Tell us your name?" onblur="endInput();"/>
            </div>
            <div style="display: flex; flex-direction: row; margin: 8px 0px;">
                <div style="width: 200px;" id="stat_egg">Eggs</div>
                <div style="width: 300px; text-align: right;" id="value_egg">0</div>
            </div>
        </div>
    </div>
    
    <script>
        var statTable={
            egg:{
                type:'int',
                val: 0,
                def: 0
            },
            name:{
                type:'str',
                val: "",
                def: "<span style='filter: opacity(50%);'>what is your name anyway?</span>"
            }
        }
        let transtable=[
            {
                id:'title',
                con:{
                    en:"STATISTICS",
                    zhHans:"统计数据"
                }
            },
            {
                id:'stat_name',
                con:{
                    en:"You're known as",
                    zhHans:"你的名字是"
                }
            },
            {
                id:'stat_egg',
                con:{
                    en:'Eggs',
                    zhHans:'蛋'
                }
            },
            {
                id:'value_name',
                con:{
                    en:"<span style='filter: opacity(50%);'>what is your name anyway?</span>",
                    zhHans:"<span style='filter: opacity(50%);'>……呃，是啥来着？</span>"
                },
                cond:function(){
                    return (statTable.name.val==statTable.name.def);
                }
            }
        ]
        function transFlush(){
            const la=localStorage.getItem('language')
            transtable.forEach(elem => {
                if(elem.cond!=null){
                    if(elem.cond()){
                        document.getElementById(elem.id).innerHTML=elem.con[la];
                    }
                }else{
                    document.getElementById(elem.id).innerHTML=elem.con[la];
                }
            });
            if(la=='en'){
                document.getElementById('input_name').placeholder='Tell us your name?'
            }else{
                document.getElementById('input_name').placeholder='告诉我们你的名字吧？'
            }
        }
        function getStat(){
            for (let stat in statTable){
                const v=localStorage.getItem(stat);
                const typ=statTable[stat].type;
                if(typ=="int"){
                    if(v==""||v==null||v==undefined){
                        statTable[stat].val=statTable[stat].def;
                    }else{
                        statTable[stat].val=Math.floor(Number(v));
                    }
                }else if(typ=="num"){
                    if(v==""||v==null||v==undefined){
                        statTable[stat].val=statTable[stat].def;
                    }else{
                        statTable[stat].val=Number(v);
                    }
                }else if(typ=="bool"){
                    if(v=="true"||v=="false"){
                        if(v=="true"){
                            statTable[stat].val=true;
                        }else{
                            statTable[stat].val=false;
                        }
                    }else{
                        statTable[stat].val=statTable[stat].def;
                    }
                }else if(typ=="str"){
                    if(v==""||v==null||v==undefined){
                        statTable[stat].val=statTable[stat].def;
                        
                    }else{
                        statTable[stat].val=v;
                    }
                }
            }
        }
        function updateStat(){
            for(let stat in statTable){
                document.getElementById('value_'+stat).innerHTML=statTable[stat].val;
            }
        }
        function startInput(){
            if(statTable.name.val!=statTable.name.def){
                document.getElementById("input_name").value=statTable.name.val;
            }
            document.getElementById("value_name").style.display="none";
            document.getElementById("input_name").style.display="block";
            document.getElementById('input_name').focus();
        }
        function endInput(){
            let v=document.getElementById('input_name').value;
            localStorage.setItem('name',v);
            document.getElementById("value_name").style.display="block";
            document.getElementById("input_name").style.display="none";
            statTable.name.val=v;
            updateStat();
        }
        document.getElementById("value_name").addEventListener("click",startInput);
        document.getElementById("input_name").addEventListener("keydown", function(event) {
            if (event.key == "Enter") {
                endInput();
            }
        });
        getStat();
        updateStat();
        transFlush();
    </script>
    
</body>
</html>
